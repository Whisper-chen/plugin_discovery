# Platform configuration for QCS8300 running Ubuntu: which camera backends to load.
#
# A ready-to-use instance of MACHINE-PLATFORM-camera.config.yaml. Install it to
# <prefix>/share/plugin_discovery/platforms.d/ (see ../CMakeLists.txt); on the first boot
# platform-detect links it to /etc/plugin_discovery/platform.d/camera.config.yaml when
# /sys/devices/soc0/machine says QCS8300 and the OS is Ubuntu.
#
# The order is the load order and the first entry is the default backend: with no backend
# named by the caller, qmmf is used. qcarcam is loaded too and serves its own cameras
# in the same process; a backend whose SDK is missing here is skipped by its probe().

domains:
  camera:
    backends: [qmmf, qcarcam]
