# Platform configuration for <MACHINE> running <PLATFORM>: which camera backends to load.
#
# Installed to <prefix>/share/plugin_discovery/platforms.d/ as a candidate. On the first
# boot platform-detect links it to /etc/plugin_discovery/platform.d/camera.config.yaml when
# the machine and the OS type match; only that link is read by plugin_discovery.
# List only backends that Qualcomm fully supports on this machine and OS. The names are the
# `backend` field of each backend's manifest (*.plugin.yaml), not the library names.

# origin: qcom          # optional; files in the platform tier default to qcom
domains:
  camera:               # the domain name declared by PLUGIN_DISCOVERY_INTERFACE
    backends: [<BACKEND_A>, <BACKEND_B>]   # added in this order
    # disable: [<BACKEND_C>]               # optional; remove a backend listed so far
