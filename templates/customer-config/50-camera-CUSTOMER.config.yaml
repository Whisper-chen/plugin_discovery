# Customer configuration: add your own backend, or take a Qualcomm one out.
#
# Install to /etc/plugin_discovery/config.d/ (the customer tier). Name it
# NN-<domain>-<source>.config.yaml, e.g. 50-camera-acme.config.yaml. Files there are
# customer-origin by default and apply after the platform tier (whatever NN is); within the
# customer tier they apply in file-name order, the later overriding the earlier.
#
# - backends: added to the list; yours come first. A backend with the same `backend`
#   name as a Qualcomm one replaces it.
# - disable: removed from the list so far. Listing a backend again in a later file (or
#   in `backends` of a customer file after a platform disable) enables it again.
# - reset: forget everything the earlier files set for this domain.
# - There is no replacing a platform file by one of the same name, and no masking with
#   /dev/null: every file takes part, and you override only with reset and disable.
#
# A manual choice (load({...}) or PLUGIN_DISCOVERY_BACKEND_CAMERA=a,b) replaces all layers,
# this file included. Nothing here is needed where the platform configuration already
# lists everything you want.

domains:
  camera:
    # reset: true                # use only the backends below, none of the platform's
    backends: [<MY_BACKEND>]     # the `backend` name in your backend's manifest
    disable: [<PLATFORM_BACKEND>]    # optional
