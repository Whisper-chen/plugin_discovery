<text x="145.0" y="295.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#607d8b" text-anchor="middle">share/plugin_discovery/</text>
<text x="145.0" y="311.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#607d8b" text-anchor="middle">config.d/*.yaml</text>
<text x="145.0" y="327.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#607d8b" text-anchor="middle">(installed by the user)</text>
