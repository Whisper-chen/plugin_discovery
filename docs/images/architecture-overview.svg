<text x="533.0" y="308.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#607d8b" text-anchor="middle">vendor SDK B</text>
<text x="533.0" y="325.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#607d8b" text-anchor="middle">e.g. QCarCam</text>
