<text x="376.0" y="101.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">Customer application</text>
<text x="376.0" y="118.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#607d8b" text-anchor="middle">C++ API directly</text>
<rect x="502" y="80" width="220" height="50" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.6"/>
<text x="612.0" y="101.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">Customer middleware</text>
<text x="612.0" y="118.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#607d8b" text-anchor="middle">non-ROS</text>
