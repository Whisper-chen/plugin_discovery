<rect x="250" y="252" width="730" height="104" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.6"/>
<rect x="266" y="266" width="170" height="76" rx="8" fill="#ffffff" stroke="#546e7a" stroke-width="1.6"/>
