<text x="851.0" y="101.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">ROS 2 node</text>
<text x="851.0" y="118.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#607d8b" text-anchor="middle">e.g. qrb_ros_camera</text>
<rect x="250" y="170" width="730" height="56" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.6"/>
<text x="615.0" y="194.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">Domain interface</text>
