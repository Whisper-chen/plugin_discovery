<text x="351.0" y="309.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#607d8b" text-anchor="middle">vendor SDK A</text>
<text x="351.0" y="326.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#607d8b" text-anchor="middle">e.g. CamX</text>
