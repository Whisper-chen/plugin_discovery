<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="plugin-discovery architecture overview">
<title>plugin-discovery architecture overview</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#263238"/></marker></defs>
<rect width="1000" height="560" fill="#ffffff"/>
<text x="500" y="32" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#263238" text-anchor="middle">One interface per domain, many backends behind it, loaded per configuration</text>
