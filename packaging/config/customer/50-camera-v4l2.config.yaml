# Customer configuration: add the v4l2 backend (UVC cameras) in front of the platform's.
#
# A ready-to-use instance of 50-camera-CUSTOMER.config.yaml. Install it to
# /etc/plugin_discovery/config.d/. It applies after the platform tier, and a customer
# file's backends go to the front, so on a QCS8300 Ubuntu machine the merged camera list is
#   v4l2, qmmf, qcarcam
# and v4l2 becomes the default backend. The platform backends stay loaded. To keep qmmf as
# the default, drop this file and name v4l2 explicitly in the application instead; to use
# v4l2 alone, add `reset: true`.

domains:
  camera:
    backends: [v4l2]
